<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101114"><title>PLAYBOX 遊戲</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f4f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:58px;background:#15161a;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-size:18px;font-weight:900;color:white;text-decoration:none}.brand i{font-style:normal;color:#ff4d83}.back{background:#ffffff0b;border:1px solid #ffffff22;border-radius:9px;padding:8px 12px;color:#ddd;cursor:pointer}.wrap{max-width:950px;margin:auto;padding:20px}.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.heading h1{font-size:19px;margin:0}.score{color:#aaa;font-size:12px}.score b{color:#ffd36b;margin-left:5px}.box{height:min(68vh,620px);min-height:360px;position:relative;border:1px solid #ffffff20;border-radius:15px;overflow:hidden;background:#0b1020}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#080a12dc;display:grid;place-items:center;padding:16px;backdrop-filter:blur(5px)}.overlay.hide{display:none}.dialog{width:min(450px,100%);background:#191a20;border:1px solid #ffffff25;border-radius:18px;padding:25px;text-align:center}.dialog .emoji{font-size:43px}.dialog h2{margin:8px 0;font-size:25px}.dialog p{font-size:12px;color:#b8b8c2;line-height:1.6}.btn{border:0;border-radius:10px;background:linear-gradient(110deg,#ff5988,#b58aff);padding:11px 17px;color:#20131d;font-weight:850;cursor:pointer}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.opt{background:#25262d;border:1px solid #ffffff22;border-radius:11px;padding:11px 7px;text-align:left;cursor:pointer}.opt:hover{border-color:#ff76a0}.opt b{display:block;font-size:12px;margin:5px 0}.opt small{color:#aaa;font-size:10px}.note{text-align:center;color:#8d8d98;font-size:11px;margin:10px}.toolbar{display:flex;justify-content:center;gap:8px;margin:8px}.toolbar button{background:#212228;border:1px solid #ffffff20;border-radius:9px;padding:8px 12px;color:#ddd;cursor:pointer}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px auto;max-width:350px}.memcard{height:65px;background:#292a31;border:1px solid #ffffff22;border-radius:10px;font-size:25px;cursor:pointer}.memcard.flip,.memcard.done{background:#4b3260}.bar{height:4px;background:#ffffff18}.bar span{display:block;height:100%;background:#70eee0;width:0}@media(max-width:600px){.wrap{padding:13px}.box{height:65vh;min-height:320px}.options{grid-template-columns:1fr}.opt{display:flex;align-items:center;gap:9px}.opt small{margin-left:auto}.dialog{padding:19px}.memcard{height:57px}}
</style></head><body><header class="top"><a class="brand" href="index.html">PLAY<i>BOX</i></a><button class="back" onclick="location.href='index.html'">← 遊戲庫</button></header><main class="wrap"><div class="heading"><h1 id="title"></h1><div class="score">分數 <b id="score">0</b>　🪙 <b id="coins">0</b></div></div><div class="box"><canvas id="game"></canvas><section class="overlay" id="intro"><div class="dialog"><div class="emoji" id="emoji"></div><h2 id="introTitle"></h2><p id="introText"></p><button class="btn" id="start">開始遊戲 ▶</button></div></section><section class="overlay hide" id="upgrade"><div class="dialog"><div class="emoji">✨</div><h2>AI 核心升級</h2><p>選一項能力強化；商店購買的永久升級也會生效。</p><div class="options" id="options"></div></div></section><section class="overlay hide" id="end"><div class="dialog"><div class="emoji">🏆</div><h2 id="endTitle">本局結束</h2><p id="result"></p><button class="btn" id="again">再玩一次 ↻</button> <button class="back" onclick="location.href='index.html'">回遊戲庫</button></div></section><section class="overlay hide" id="memory"><div class="dialog"><div class="emoji">🧠</div><h2>記憶矩陣</h2><p id="memStatus">配對相同圖案！</p><div class="memory" id="memGrid"></div><button class="btn" id="memAgain">重新開始</button></div></section></div><div class="bar"><span id="xpbar"></span></div><p class="note" id="hint"></p><div class="toolbar"><button id="pause">Ⅱ 暫停</button><button onclick="location.href='index.html'">⌂ 遊戲大廳</button></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),id=new URLSearchParams(location.search).get('game')||'survival',info={survival:['AI 核心：生存協議','🤖','WASD／方向鍵移動，武器自動攻擊。擊敗敵人收集資料碎片，升級核心。'],runner:['霓虹資料衝刺','🏃','點擊或按空白鍵跳躍，避開障礙並收集資料。'],memory:['記憶矩陣','🧠','翻開卡片配對，完成即可獲得獎勵。'],clicker:['量子點擊工廠','⚡','快速點擊能量核心，累積連擊和遊戲幣。'],orbit:['星環守衛','🪐','移動躲避敵人，存活越久分數越高。'],blocks:['方塊工坊','🧩','左右移動躲避方塊，存活取得分數。'],defense:['像素塔防：基地線','🏰','點擊場地放置防禦塔，守住左側基地。'],color:['色彩反應測驗','🎨','點擊比較亮的色塊，答錯即結束。'}};let game=info[id]?id:'survival';$('title').textContent=$('introTitle').textContent=info[game][0];$('emoji').textContent=info[game][1];$('introText').textContent=info[game][2];$('hint').textContent=game==='runner'?'點擊／空白鍵跳躍':game==='survival'?'WASD／方向鍵移動 · 自動攻擊':'觸控或鍵盤操作';let W=0,H=0,dpr=1,state='intro',raf=0,last=0,t=0,score=0,coins=+(localStorage.getItem('pb-coins')||0),up=JSON.parse(localStorage.getItem('pb-upgrades')||'{}'),player,enemies=[],bullets=[],gems=[],parts=[],keys={},spawn=0,fire=0,xp=0,need=5,level=1,health=100,bonus=1,runY=0,runV=0,obstacles=[],combo=0,comboTimer=0,towers=[],round=0;function resize(){let r=canvas.parentElement.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas.parentElement);resize();function ui(){$('score').textContent=Math.floor(score);$('coins').textContent=coins}function pay(base){let total=Math.floor((base+Math.floor(score/4)+level*3)*(1+(up.bonus||0)*.1));coins+=total;localStorage.setItem('pb-coins',coins);ui();$('result').textContent=`本局得分 ${Math.floor(score)}，獲得 ${total} 枚遊戲幣！${game==='survival'?`生存等級 ${level}。`:''}`}function reset(){t=0;score=0;level=1;xp=0;need=5;health=100+(up.health||0)*20;enemies=[];bullets=[];gems=[];parts=[];spawn=.4;fire=0;runY=H*.75;runV=0;obstacles=[];combo=0;towers=[];round=0;player={x:W/2,y:H/2,r:13,hp:health,inv:0};ui()}function begin(){if(game==='memory'){memoryGame();return}reset();state=game==='clicker'?'clicker':'play';$('intro').classList.add('hide');$('end').classList.add('hide');$('upgrade').classList.add('hide');$('memory').classList.add('hide');if(raf)cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}function spawnEnemy(){enemies.push({x:W+25,y:25+Math.random()*(H-50),r:10+Math.random()*5,hp:1+Math.floor(t/30),speed:48+Math.random()*35+t})}function shoot(){if(!enemies.length)return;let e=enemies.reduce((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)<Math.hypot(b.x-player.x,b.y-player.y)?a:b),a=Math.atan2(e.y-player.y,e.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*400,vy:Math.sin(a)*400,life:1.4,damage:1+(up.damage||0)})}function burst(x,y,c){for(let i=0;i<5;i++){let a=Math.random()*6.28,s=25+Math.random()*100;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4,c})}}function upgrade(){state='upgrade';$('upgrade').classList.remove('hide');let list=[['💥','量子增幅','傷害 +1',()=>bonus++],['⚡','超頻射速','攻擊速度提升',()=>fire=Math.max(0,fire-.2)],['💨','敏捷協定','移動速度提升',()=>bonus+=.2],['💚','核心修復','恢復 35 生命',()=>player.hp=Math.min(health,player.hp+35)],['🛡️','相位護盾','額外耐久 +20',()=>health+=20]];let box=$('options');box.innerHTML='';for(let i=0;i<3;i++){let u=list.splice(Math.floor(Math.random()*list.length),1)[0],b=document.createElement('button');b.className='opt';b.innerHTML=`<span>${u[0]}</span><div><b>${u[1]}</b><small>${u[2]}</small></div>`;b.onclick=()=>{u[3]();level++;$('upgrade').classList.add('hide');state='play';last=performance.now();raf=requestAnimationFrame(loop)};box.append(b)}}function end(){state='end';cancelAnimationFrame(raf);pay(game==='memory'?40:10);$('endTitle').textContent=game==='runner'?'衝刺完成！':'本局結束';$('end').classList.remove('hide');$('pause').textContent='Ⅱ 暫停'}function update(dt){t+=dt;if(game==='survival'||game==='orbit'){spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.25,.95-t*.008)}let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(mx,my)||1;player.x=Math.max(13,Math.min(W-13,player.x+mx/len*200*(1+(up.speed||0)*.1)*dt));player.y=Math.max(13,Math.min(H-13,player.y+my/len*200*(1+(up.speed||0)*.1)*dt));if(game==='survival'){fire-=dt;if(fire<=0){shoot();fire=Math.max(.12,.42-bonus*.05)}}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(game==='orbit'){e.x-=e.speed*dt;if(e.x<-25){enemies.splice(i,1);score++;continue}}else{let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(Math.hypot(player.x-e.x,player.y-e.y)<e.r+player.r){if(game==='orbit'){enemies.splice(i,1);score++}else if(player.inv<=0){player.hp-=12;player.inv=.8;burst(player.x,player.y,'#ff577d');if(player.hp<=0){end();return}}}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.hp-=b.damage;hit=true;if(e.hp<=0){gems.push({x:e.x,y:e.y});enemies.splice(j,1);score++}break}}if(hit||b.life<=0)bullets.splice(i,1)}for(let i=gems.length-1;i>=0;i--){let g=gems[i],d=Math.hypot(player.x-g.x,player.y-g.y)||1;if(d<100*(1+(up.magnet||0)*.25)){g.x+=(player.x-g.x)/d*260*dt;g.y+=(player.y-g.y)/d*260*dt}if(d<20){gems.splice(i,1);xp++;if(xp>=need){xp-=need;need=Math.ceil(need*1.35);upgrade();return}}}$('xpbar').style.width=xp/need*100+'%'}if(game==='runner'){let ground=H*.78;runV+=800*dt;runY+=runV*dt;if(runY>ground-24){runY=ground-24;runV=0}spawn-=dt;if(spawn<0){obstacles.push({x:W+20,y:ground-30,w:23,h:25+Math.random()*40});spawn=Math.max(.55,1.3-t*.012)}obstacles.forEach(o=>o.x-=(230+t*5)*dt);obstacles=obstacles.filter(o=>o.x+o.w>0);if(obstacles.some(o=>o.x<72&&o.x+o.w>45&&runY+24>o.y)){end();return}score=Math.floor(t*10)}if(game==='blocks'){spawn-=dt;if(spawn<0){enemies.push({x:Math.random()*(W-40)+20,y:-20,r:12, speed:80+Math.random()*100});spawn=.7}enemies.forEach(e=>e.y+=e.speed*dt);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.y>H){enemies.splice(i,1);score++;continue}player.x=Math.max(12,Math.min(W-12,player.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*220*dt));if(Math.hypot(player.x-e.x,player.y-e.y)<e.r+12){end();return}}}if(game==='defense'){spawn-=dt;if(spawn<0){enemies.push({x:W+10,y:30+Math.random()*(H-60),r:10,hp:1,speed:30+t});spawn=1}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.x-=e.speed*dt;if(e.x<10){end();return}}towers.forEach(a=>{a.cd-=dt;if(a.cd<0){let e=enemies.find(x=>Math.hypot(x.x-a.x,x.y-a.y)<160);if(e){enemies.splice(enemies.indexOf(e),1);score++;a.cd=.65}}})}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<0)parts.splice(i,1)}ui()}function draw(){ctx.fillStyle=game==='runner'?'#102136':'#0b1020';ctx.fillRect(0,0,W,H);for(let i=0;i<55;i++){let x=(i*167.3)%W,y=(i*97+t*(8+i%4))%H;ctx.fillStyle='#d5e9ff44';ctx.fillRect(x,y,1.5,1.5)}if(game==='survival'||game==='orbit'){gems.forEach(g=>{ctx.fillStyle='#73f4e3';ctx.beginPath();ctx.arc(g.x,g.y,5,0,7);ctx.fill()});bullets.forEach(b=>{ctx.fillStyle='#e2ffff';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()});enemies.forEach(e=>{ctx.fillStyle='#ff5685';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()});ctx.globalAlpha=player.inv>0?.4:1;ctx.fillStyle='#8cffff';ctx.shadowBlur=18;ctx.shadowColor='#69f4ff';ctx.beginPath();ctx.arc(player.x,player.y,13,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;if(game==='survival'){ctx.fillStyle='#ffffff33';ctx.fillRect(12,12,100,6);ctx.fillStyle='#ff6388';ctx.fillRect(12,12,100*player.hp/health,6)}}if(game==='runner'){let g=H*.78;ctx.fillStyle='#63eddb';ctx.fillRect(0,g,W,2);ctx.fillStyle='#a88bff';ctx.fillRect(48,runY,24,24);obstacles.forEach(o=>{ctx.fillStyle='#ff5685';ctx.fillRect(o.x,o.y,o.w,H-o.y)})}if(game==='blocks'){ctx.fillStyle='#a88bff';ctx.fillRect(player.x-12,player.y-12,24,24);enemies.forEach(e=>{ctx.fillStyle='#ff6388';ctx.fillRect(e.x-10,e.y-10,20,20)})}if(game==='defense'){ctx.fillStyle='#ff6388';enemies.forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,9,0,7);ctx.fill()});ctx.fillStyle='#69e3b1';towers.forEach(a=>{ctx.beginPath();ctx.arc(a.x,a.y,10,0,7);ctx.fill()})}if(game==='clicker'){ctx.fillStyle='#4fe3c7';ctx.shadowBlur=35;ctx.shadowColor='#4fe3c7';ctx.beginPath();ctx.arc(W/2,H/2,75+Math.sin(t*4)*4,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='52px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',W/2,H/2)}parts.forEach(p=>{ctx.globalAlpha=p.l*2;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1}function loop(now){if(state!=='play')return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(state==='play')raf=requestAnimationFrame(loop)}function jump(){if(game==='runner'&&state==='play'&&runY>H*.78-28)runV=-360}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();jump()}if(e.key==='Escape')pause()});window.addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('pointerdown',e=>{if(game==='runner')jump();if(game==='clicker'&&state==='clicker'){score++;coins+=1+(up.bonus||0);localStorage.setItem('pb-coins',coins);ui();draw()}if(game==='defense'&&state==='play'){let r=canvas.getBoundingClientRect();towers.push({x:e.clientX-r.left,y:e.clientY-r.top,cd:0})}});function pause(){if(state==='play'){state='paused';cancelAnimationFrame(raf);$('introTitle').textContent='遊戲暫停';$('introText').textContent='準備好後繼續遊玩。';$('start').textContent='繼續遊戲 ▶';$('intro').classList.remove('hide')}else if(state==='paused'){state='play';$('intro').classList.add('hide');last=performance.now();raf=requestAnimationFrame(loop)}}$('pause').onclick=pause;$('start').onclick=()=>state==='paused'?pause():begin();$('again').onclick=begin;
function memoryGame(){state='memory';$('intro').classList.add('hide');$('memory').classList.remove('hide');$('pause').style.display='none';let a=['🌙','🌟','🚀','💎','🪐','👾','🎮','🔮'].concat(['🌙','🌟','🚀','💎','🪐','👾','🎮','🔮']).sort(()=>Math.random()-.5),open=[],matched=[],lock=false,moves=0,grid=$('memGrid');grid.innerHTML='';$('memStatus').textContent='配對相同圖案！';a.forEach((v,i)=>{let b=document.createElement('button');b.className='memcard';b.textContent='?';b.onclick=()=>{if(lock||matched.includes(i)||open.includes(i))return;b.textContent=v;b.classList.add('flip');open.push(i);if(open.length===2){moves++;if(a[open[0]]===a[open[1]]){matched.push(...open);open=[];if(matched.length===16){score=Math.max(0,1000-moves*10);end()}}else{lock=true;setTimeout(()=>{open.forEach(k=>{grid.children[k].textContent='?';grid.children[k].classList.remove('flip')});open=[];lock=false},650)}}};grid.append(b)})}$('memAgain').onclick=memoryGame;$('start').onclick=begin;$('again').onclick=()=>{if(game==='memory')memoryGame();else begin()};if(game==='memory')$('start').onclick=memoryGame;function clickerStart(){state='clicker';reset();$('intro').classList.add('hide');$('pause').style.display='none';draw()}if(game==='clicker')$('start').onclick=clickerStart;$('pause').style.display=['memory','clicker'].includes(game)?'none':'';if(game==='clicker')$('hint').textContent='每次點擊都賺取遊戲幣；返回大廳即可購買升級。';$('intro').classList.remove('hide');draw();ui()})();
</script></body></html>
