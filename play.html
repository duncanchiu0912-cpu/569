Math.random()*35+t})}function shoot(){if(!enemies.length)return;let e=enemies.reduce((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)<Math.hypot(b.x-player.x,b.y-player.y)?a:b),a=Math.atan2(e.y-player.y,e.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*400,vy:Math.sin(a)*400,life:1.4,damage:1+(profile.items.damage||0)+(profile.skills.power||0)+(character.damage||0)})}function upgrade(){state='upgrade';$('upgrade').classList.remove('hide');let list=[['💥','量子增幅','傷害 +1',()=>bonus++],['⚡','超頻射速','攻擊速度提升',()=>fire=Math.max(0,fire-.2)],['💨','迅捷協定','移動速度提升',()=>bonus+=.2],['💚','核心修復','恢復 35 生命',()=>player.hp=Math.min(life,player.hp+35)],['🧲','資料磁吸','碎片吸取範圍提升',()=>bonus+=.3]],box=$('opts');box.innerHTML='';for(let i=0;i<3;i++){let u=list.splice(Math.floor(Math.random()*list.length),1)[0],b=document.createElement('button');b.className='opt';b.innerHTML=`<span>${u[0]}</span><div><b>${u[1]}</b><small>${u[2]}</small></div>`;b.onclick=()=>{u[3]();$('upgrade').classList.add('hide');state='play';last=performance.now();raf=requestAnimationFrame(loop)};box.append(b)}}
function update(dt){t+=dt;if(game==='survival'||game==='orbit'){spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.24,.96-t*.008)}let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),ln=Math.hypot(mx,my)||1,sp=200*(character.speed||1)*(1+(profile.items.speed||0)*.1+(profile.skills.agility||0)*.08);player.x=Math.max(13,Math.min(W-13,player.x+mx/ln*sp*dt));player.y=Math.max(13,Math.min(H-13,player.y+my/ln*sp*dt));if(game==='survival'){fire-=dt;if(fire<=0){shoot();fire=Math.max(.12,.42-bonus*.04)}}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(game==='orbit'){e.x-=e.speed*dt;if(e.x<-25){enemies.splice(i,1);score++;continue}}else{let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(game==='survival'&&Math.hypot(player.x-e.x,player.y-e.y)<e.r+player.r&&player.inv<=0){player.hp-=12*(1-(profile.skills.vitality||0)*.08);player.inv=.8;burst(player.x,player.y,'#ff577d');if(player.hp<=0){finish();return}}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.hp-=b.damage;hit=true;if(e.hp<=0){gems.push({x:e.x,y:e.y});enemies.splice(j,1);score++;sfx(760,.06)}break}}if(hit||b.life<=0)bullets.splice(i,1)}for(let i=gems.length-1;i>=0;i--){let g=gems[i],d=Math.hypot(player.x-g.x,player.y-g.y)||1;if(d<100*(1+(profile.items.magnet||0)*.25+(profile.skills.magnet||0)*.2+(character.magnet||0)*.1+bonus)){g.x+=(player.x-g.x)/d*260*dt;g.y+=(player.y-g.y)/d*260*dt}if(d<20){gems.splice(i,1);xp++;if(xp>=need){xp-=need;need=Math.ceil(need*1.35);upgrade();return}}}$('xpbar').style.width=xp/need*100+'%'}
if(['runner','runner2'].includes(game)){let ground=H*.78;runV+=820*dt;runY+=runV*dt;if(runY>ground-24){runY=ground-24;runV=0}spawn-=dt;if(spawn<0){obstacles.push({x:W+20,y:ground-25,w:19+Math.random()*20,h:26+Math.random()*36});spawn=Math.max(.48,1.25-t*.012)}obstacles.forEach(o=>o.x-=(230+t*5)*dt);obstacles=obstacles.filter(o=>o.x+o.w>0);if(obstacles.some(o=>o.x<72&&o.x+o.w>45&&runY+24>o.y)){finish();return}score=Math.floor(t*10);if(Math.random()<dt*.55)targets.push({x:W+10,y:ground-65-Math.random()*100});targets.forEach(a=>a.x-=(230+t*5)*dt);for(let i=targets.length-1;i>=0;i--)if(targets[i].x<65&&targets[i].x>25&&Math.abs(targets[i].y-runY)<35){targets.splice(i,1);score+=15}}
if(game==='blocks'){spawn-=dt;if(spawn<0){enemies.push({x:Math.random()*(W-40)+20,y:-20,r:12,speed:80+Math.random()*100});spawn=.65}enemies.forEach(e=>e.y+=e.speed*dt);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.y>H){enemies.splice(i,1);score++;continue}player.x=Math.max(12,Math.min(W-12,player.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*230*dt));if(Math.hypot(player.x-e.x,player.y-e.y)<e.r+12){finish();return}}}
if(game==='defense'){spawn-=dt;if(spawn<0){enemies.push({x:W+8,y:25+Math.random()*(H-50),r:10,hp:1,speed:30+t});spawn=1}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.x-=e.speed*dt;if(e.x<8){finish();return}}towers.forEach(a=>{a.cd-=dt;if(a.cd<0){let e=enemies.find(x=>Math.hypot(x.x-a.x,x.y-a.y)<155);if(e){enemies.splice(enemies.indexOf(e),1);score++;a.cd=.65}}})}
if(game==='target'){targets.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x<20||a.x>W-20)a.vx*=-1;if(a.y<20||a.y>H-20)a.vy*=-1});if(targets.length<Math.min(5,1+Math.floor(t/7))){let r=Math.max(11,25-t*.25);targets.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),r,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140})}if(t>45){finish();return}score=Math.max(score,Math.floor(t*2))}

function draw(){ctx.fillStyle=['runner','runner2'].includes(game)?'#102136':'#0b1020';ctx.fillRect(0,0,W,H);for(let i=0;i<48;i++){let x=i*179%W,y=(i*93+t*(7+i%4))%H;ctx.fillStyle='#d5e9ff38';ctx.fillRect(x,y,1.4,1.4)}if(['survival','orbit'].includes(game)){gems.forEach(g=>{ctx.fillStyle='#73f4e3';ctx.shadowBlur=12;ctx.shadowColor='#73f4e3';ctx.beginPath();ctx.arc(g.x,g.y,5,0,7);ctx.fill();ctx.shadowBlur=0});bullets.forEach(b=>{ctx.fillStyle='#e2ffff';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()});enemies.forEach(e=>{ctx.fillStyle='#ff5685';ctx.shadowBlur=12;ctx.shadowColor='#ff5685';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.shadowBlur=0});ctx.globalAlpha=player.inv>0?.4:1;let colors={nova:'#8cffff',blaze:'#ff8b67',wisp:'#d1a8ff'};ctx.fillStyle=colors[profile.character]||colors.nova;ctx.shadowBlur=21;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.ellipse(player.x,player.y+5,14,9,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(player.x,player.y-5,9,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;if(game==='survival'){ctx.fillStyle='#ffffff33';ctx.fillRect(12,12,100,6);ctx.fillStyle='#ff6388';ctx.fillRect(12,12,100*Math.max(0,player.hp/life),6)}}if(['runner','runner2'].includes(game)){let g=H*.78;ctx.fillStyle='#63eddb';ctx.fillRect(0,g,W,2);ctx.fillStyle='#aa8cff';ctx.fillRect(48,runY,24,24);obstacles.forEach(o=>{ctx.fillStyle='#ff5685';ctx.fillRect(o.x,o.y,o.w,H-o.y)});targets.forEach(a=>{ctx.fillStyle='#70f4e4';ctx.beginPath();ctx.arc(a.x,a.y,6,0,7);ctx.fill()})}if(game==='blocks'){ctx.fillStyle='#aa8cff';ctx.fillRect(player.x-12,player.y-12,24,24);enemies.forEach(e=>{ctx.fillStyle='#ff6388';ctx.fillRect(e.x-10,e.y-10,20,20)})}if(game==='defense'){enemies.forEach(e=>{ctx.fillStyle='#ff6388';ctx.beginPath();ctx.arc(e.x,e.y,9,0,7);ctx.fill()});towers.forEach(a=>{ctx.fillStyle='#69e3b1';ctx.beginPath();ctx.arc(a.x,a.y,10,0,7);ctx.fill()});ctx.fillStyle='#fff5';ctx.fillRect(0,0,6,H)}if(game==='clicker'){ctx.fillStyle='#49e5c9';ctx.shadowBlur=35;ctx.shadowColor='#49e5c9';ctx.beginPath();ctx.arc(W/2,H/2,75+Math.sin(t*4)*4,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='52px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',W/2,H/2)}if(game==='target'){targets.forEach(a=>{ctx.fillStyle='#ff5a88';ctx.shadowBlur=22;ctx.shadowColor='#ff5a88';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffe2ee';ctx.beginPath();ctx.arc(a.x,a.y,a.r*.55,0,7);ctx.stroke()})}if(game==='color'||game==='puzzle'){let size=Math.min(W*.75,H*.72)/tileN,ox=(W-size*tileN)/2,oy=(H-size*tileN)/2;tiles.forEach(v=>{ctx.fillStyle=game==='color'?`hsl(${canvas.dataset.hue||180},75%,${v.c?68:45}%)`:['#ff618c','#65dced','#a68cff','#ffcc68'][v.c];ctx.beginPath();ctx.roundRect(ox+v.x*size+3,oy+v.y*size+3,size-6,size-6,7);ctx.fill()});canvas.dataset.size=size;canvas.dataset.ox=ox;canvas.dataset.oy=oy}particles.forEach(p=>{ctx.globalAlpha=p.l*2;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1}
function reward(){let multiplier=1+(profile.skills.fortune||0)*.08+(profile.items.bonus||0)*.1;if(profile.boosts>0){multiplier*=2;profile.boosts--}let coins=Math.max(5,Math.floor((score+10)*multiplier));profile.coins+=coins;let xpGain=Math.max(10,Math.floor((score+20)*(1+(profile.skills.xp||0)*.1)));profile.xp=(profile.xp||0)+xpGain;while(profile.xp>=100+(profile.level-1)*50){profile.xp-=100+(profile.level-1)*50;profile.level++;profile.skillPoints=(profile.skillPoints||0)+1}stats=profile.stats[game]||{level:1,xp:0,best:0,scores:[]};stats.best=Math.max(stats.best,Math.floor(score));stats.xp=(stats.xp||0)+xpGain;while(stats.xp>=100+(stats.level-1)*50){stats.xp-=100+(stats.level-1)*50;stats.level++}stats.scores=stats.scores||[];stats.scores.push({name:profile.name||'玩家',score:Math.floor(score),date:new Date().toLocaleDateString()});stats.scores.sort((a,b)=>b.score-a.score);stats.scores=stats.scores.slice(0,10);profile.stats[game]=stats;let drop='';if(Math.random()<.3){let pool=['coins','boost','crate'];let got=pool[Math.floor(Math.random()*pool.length)];if(got==='coins'){let n=25+Math.floor(Math.random()*76);profile.coins+=n;drop=`另有掉落：🪙 ${n}！`}else if(got==='boost'){profile.boosts=(profile.boosts||0)+1;drop='掉落：雙倍獎勵券！'}else{profile.inventory.crate=(profile.inventory.crate||0)+1;drop='掉落：稀有補給箱！'}}save();ui();$('result').textContent=`本局 ${Math.floor(score)} 分 · +${coins} 幣 · +${xpGain} XP。遊戲 Lv.${stats.level}。${drop}排行榜紀錄已保存於本機。`;}
function finish(){if(state==='end')return;state='end';cancelAnimationFrame(raf);reward();$('end').classList.remove('hide');sfx(880,.2)}function loop(now){if(state!=='play')return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(state==='play')raf=requestAnimationFrame(loop)}function jump(){if(['runner','runner2'].includes(game)&&state==='play'&&runY>=H*.78-28){runV=-360;sfx(500,.08)}}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();jump()}if(e.key==='Escape')pause()});window.addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(['runner','runner2'].includes(game))jump();if(game==='clicker'&&state==='clicker'){score+=1+(profile.items.damage||0);profile.coins+=1+(profile.items.bonus||0);save();ui();draw();sfx(700+Math.random()*250,.06)}if(game==='defense'&&state==='play'){towers.push({x,y,cd:0});sfx(420)}if(game==='target'&&state==='play'){let i=targets.findIndex(a=>Math.hypot(a.x-x,a.y-y)<a.r);if(i>=0){targets.splice(i,1);score+=10;sfx(800,.08)}else score=Math.max(0,score-2)}if(game==='color'&&state==='play'){let c=Math.floor((x-(+canvas.dataset.ox))/+canvas.dataset.size),r=Math.floor((y-(+canvas.dataset.oy))/+canvas.dataset.size),pick=r*tileN+c;if(pick===+canvas.dataset.target){score+=10;makeColor();sfx(720)}else finish()}if(game==='puzzle'&&state==='play'){let c=Math.floor((x-(+canvas.dataset.ox))/+canvas.dataset.size),r=Math.floor((y-(+canvas.dataset.oy))/+canvas.dataset.size),i=r*tileN+c;if(i>=0&&i<tiles.length){tiles[i].c=(tiles[i].c+1)%4;score++;if(score%10===0){score+=5;sfx(900)}draw()}}});function pause(){if(state==='play'){state='paused';cancelAnimationFrame(raf);$('introTitle').textContent='遊戲暫停';$('introText').textContent='準備好後繼續挑戰。';$('start').textContent='繼續遊戲 ▶';$('intro').classList.remove('hide')}else if(state==='paused'){state='play';$('intro').classList.add('hide');last=performance.now();raf=requestAnimationFrame(loop)}}$('pause').onclick=pause;
function memoryGame(){reset();state='memory';$('intro').classList.add('hide');$('memory').classList.remove('hide');$('pause').style.display='none';let a=['🌙','🌟','🚀','💎','🪐','👾','🎮','🔮'].concat(['🌙','🌟','🚀','💎','🪐','👾','🎮','🔮']).sort(()=>Math.random()-.5),open=[],matched=[],lock=false,moves=0,grid=$('memGrid');grid.innerHTML='';$('memStatus').textContent='配對相同圖案！';a.forEach((v,i)=>{let b=document.createElement('button');b.className='mem';b.textContent='?';b.onclick=()=>{if(lock||matched.includes(i)||open.includes(i))return;b.textContent=v;b.classList.add('flip');open.push(i);sfx(420);if(open.length===2){moves++;if(a[open[0]]===a[open[1]]){matched.push(...open);open=[];if(matched.length===16){score=Math.max(20,300-moves*5);$('memory').classList.add('hide');finish()}}else{lock=true;setTimeout(()=>{open.forEach(k=>{grid.children[k].textContent='?';grid.children[k].classList.remove('flip')});open=[];lock=false},650)}}};grid.append(b)})}function reactionGame(){reset();state='reaction';$('intro').classList.add('hide');$('reaction').classList.remove('hide');let btn=$('reactBtn');btn.style.background='#6b3346';$('reactText').textContent='按「準備」，等畫面變綠再點擊。';btn.textContent='準備';btn.onclick=()=>{btn.disabled=true;btn.style.background='#a8435c';$('reactText').textContent='等綠色…';setTimeout(()=>{if(state!=='reaction')return;reactionAt=performance.now();btn.disabled=false;btn.style.background='#38b77a';btn.textContent='現在點！';btn.onclick=()=>{score=Math.max(0,1000-Math.floor(performance.now()-reactionAt));$('reaction').classList.add('hide');finish()}},900+Math.random()*2500)}}$('start').onclick=()=>state==='paused'?pause():begin();$('again').onclick=()=>game==='memory'?memoryGame():begin();$('memAgain').onclick=memoryGame;if(game==='memory')$('start').onclick=memoryGame;if(game==='reaction')$('start').onclick=reactionGame;$('pause').style.display=['memory','reaction','clicker'].includes(game)?'none':'';if(game==='clicker')$('hint').textContent='點擊核心累積分數與遊戲幣；結算可再獲得經驗。';if(game==='puzzle')$('hint').textContent='點擊方格變換光子顏色，累積分數。';if(game==='target')$('hint').textContent='點擊目標得分，挑戰 45 秒最高命中。';if(game==='defense')$('hint').textContent='點擊場地部署砲塔，守護左側基地。';$('sound').textContent='♫ 音效開啟';draw();ui()})();
</script></body></html>
