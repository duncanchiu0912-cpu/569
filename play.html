<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),params=new URLSearchParams(location.search),id=params.get('game')||'survival';const config={survival:['AI 核心：生存協議','🤖','升級你的 AI 核心，在不斷演化的敵方攻勢中生存。WASD 或方向鍵移動，武器會自動攻擊。'],runner:['霓虹資料衝刺','🏃','按空白鍵／點擊跳躍，躲避障礙並收集資料。跑得越遠，速度越快！'],memory:['記憶矩陣','🧠','翻開卡片找出所有相同配對。試著用最少步數完成挑戰！'],orbit:['星環守衛','🪐','移動你的防衛核心，躲開紅色隕石、收集能量。存活越久分數越高！'],blocks:['方塊工坊','🧩','左右移動、下方向加速，填滿整行即可消除得分。'],clicker:['量子點擊工廠','⚡','盡量點擊能量核心！連續點擊累積連擊，挑戰你的手速。'],defense:['像素塔防：基地線','🏰','點擊跑道放置防禦塔，自動阻止敵人抵達基地。'],color:['色彩反應測驗','🎨','找出和目標色彩不同的方格。每一關會更難，考驗你的反應！']};let game=config[id]?id:'survival';$('title').textContent=config[game][0];$('introEmoji').textContent=config[game][1];$('introTitle').textContent=config[game][0];$('introText').textContent=config[game][2];let W=0,H=0,dpr=1,state='intro',raf=0,last=0,elapsed=0,score=0,level=1,hp=100,player,enemies=[],bullets=[],gems=[],particles=[],keys={},upgrades={damage:1,rate:1,speed:1,shield:0,magnet:1},spawn=0,shot=0,xp=0,xpNeed=5,runnerY=0,runnerV=0,obstacles=[],orbital=[],tower=[],clicks=0,combo=0,comboTimer=0,tileRound=0,mem={cards:[],open:[],moves:0,lock:false};const colors=['#68edff','#a88cff','#ff638b','#fbc96c','#72e6a3'];
function resize(){const r=canvas.parentElement.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=Math.min(W-20,player.x);player.y=Math.min(H-20,player.y)}}new ResizeObserver(resize).observe(canvas.parentElement);resize();
function setScore(v){score=v;$('score').textContent=Math.floor(score)}function baseReset(){elapsed=0;score=0;level=1;xp=0;xpNeed=5;enemies=[];bullets=[];gems=[];particles=[];spawn=0;shot=0;upgrades={damage:1,rate:1,speed:1,shield:0,magnet:1};player={x:W/2,y:H*.68,r:13,hp:100,inv:0};obstacles=[];orbital=[];tower=[];clicks=0;combo=0;runnerY=H*.75;runnerV=0;$('level').textContent=1;$('levelWrap').classList.toggle('hide',game==='memory'||game==='clicker');$('scoreLabel').textContent=game==='clicker'?'能量':'分數';$('xpbar').style.width='0%'}
function begin(){if(game==='memory'){memoryStart();return}if(game==='clicker'){baseReset();state='clicker';$('intro').classList.add('hidden');draw();return}baseReset();state='play';$('intro').classList.add('hidden');$('finish').classList.add('hidden');$('upgradeOverlay').classList.add('hidden');$('memoryOverlay').classList.add('hidden');$('pause').textContent='Ⅱ 暫停';$('pause').classList.remove('hide');last=performance.now();if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function enemySpawn(){let y=25+Math.random()*(H-50);enemies.push({x:W+20,y,r:10+Math.random()*5,hp:1+Math.floor(elapsed/28),speed:54+Math.random()*35+elapsed*1.1})}

function levelUp(){state='upgrade';$('upgradeOverlay').classList.remove('hidden');let list=[['💥','量子增幅','武器傷害 +1',()=>upgrades.damage++],['⚡','超頻射速','攻擊速度提升 25%',()=>upgrades.rate*=1.25],['💨','敏捷協定','移動速度提升 18%',()=>upgrades.speed*=1.18],['🛡️','相位護盾','有 20% 機率抵消傷害',()=>upgrades.shield=Math.min(.8,upgrades.shield+.2)],['🧲','資料磁吸','能量碎片吸取範圍增加',()=>upgrades.magnet+=.65],['💚','核心修復','恢復 35 點核心耐久',()=>player.hp=Math.min(100,player.hp+35)]];let box=$('upgrades');box.innerHTML='';for(let i=0;i<3;i++){let u=list.splice(Math.floor(Math.random()*list.length),1)[0],b=document.createElement('button');b.className='upgrade';b.innerHTML=`<span>${u[0]}</span><div><b>${u[1]}</b><small>${u[2]}</small></div>`;b.onclick=()=>{u[3]();level++;$('level').textContent=level;$('upgradeOverlay').classList.add('hidden');state='play';last=performance.now();raf=requestAnimationFrame(loop)};box.append(b)}}
function update(dt){elapsed+=dt;if(game==='survival'||game==='orbit'){spawn-=dt;if(spawn<=0){enemySpawn();spawn=Math.max(.24,.92-elapsed*.008)}if(game==='orbit'){let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),d=Math.hypot(mx,my)||1;player.x=Math.max(15,Math.min(W-15,player.x+mx/d*210*dt));player.y=Math.max(15,Math.min(H-15,player.y+my/d*210*dt))}else{let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),d=Math.hypot(mx,my)||1;player.x=Math.max(15,Math.min(W-15,player.x+mx/d*205*upgrades.speed*dt));player.y=Math.max(15,Math.min(H-15,player.y+my/d*205*upgrades.speed*dt));shot-=dt;if(shot<=0){fire();shot=Math.max(.12,.42/upgrades.rate)}}
 for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(game==='orbit'){e.x-=e.speed*dt;if(e.x<-25){enemies.splice(i,1);continue}}else{let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){if(game==='orbit'){enemies.splice(i,1);setScore(score+1)}else if(player.inv<=0){if(Math.random()>=upgrades.shield)player.hp-=15;player.inv=.75;particle(player.x,player.y,'#ff577d');if(player.hp<=0){finish();return}}}}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){e.hp-=b.damage;hit=true;particle(e.x,e.y,'#ff668d');if(e.hp<=0){gems.push({x:e.x,y:e.y,r:5});enemies.splice(j,1);setScore(score+1)}break}}if(hit||b.life<=0)bullets.splice(i,1)}
 for(let i=gems.length-1;i>=0;i--){let g=gems[i],dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy)||1;if(d<95*upgrades.magnet){g.x+=dx/d*330*dt;g.y+=dy/d*330*dt}if(d<player.r+g.r+5){gems.splice(i,1);xp++;if(xp>=xpNeed){xp-=xpNeed;xpNeed=Math.ceil(xpNeed*1.35);levelUp();return}}}$('xpbar').style.width=(xp/xpNeed*100)+'%'}
 if(game==='runner'){let ground=H*.78;runnerV+=780*dt;runnerY+=runnerV*dt;if(runnerY>ground-24){runnerY=ground-24;runnerV=0}spawn-=dt;if(spawn<0){obstacles.push({x:W+30,y:ground-25,w:22+Math.random()*18,h:25+Math.random()*50});spawn=Math.max(.5,1.3-elapsed*.013)}obstacles.forEach(o=>o.x-=(230+elapsed*7)*dt);obstacles=obstacles.filter(o=>o.x+o.w>0);for(let o of obstacles)if(o.x<80&&o.x+o.w>48&&runnerY+24>o.y){finish();return}setScore(Math.floor(elapsed*10));if(Math.random()<dt*.8)gems.push({x:W+15,y:ground-70-Math.random()*100,r:6});for(let i=gems.length-1;i>=0;i--){gems[i].x-=(230+elapsed*7)*dt;if(gems[i].x<65&&gems[i].x>25&&Math.abs(gems[i].y-(runnerY+12))<28){gems.splice(i,1);setScore(score+25)}}}
 if(game==='blocks'){spawn-=dt;if(spawn<=0){orbital.push({x:W/2+((Math.random()-.5)*W*.75),y:-20,r:12+Math.random()*10,vy:80+Math.random()*70});spawn=.8}orbital.forEach(o=>o.y+=o.vy*dt);orbital=orbital.filter(o=>{if(o.y>H+20){setScore(score+1);return false}if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+13){finish();return false}return true});player.x=Math.max(15,Math.min(W-15,player.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*250*dt))}
 if(game==='defense'){spawn-=dt;if(spawn<=0){enemies.push({x:W+10,y:30+Math.random()*(H-70),r:10,hp:1,speed:30+elapsed});spawn=1.1}enemies.forEach(e=>e.x-=e.speed*dt);for(let i=enemies.length-1;i>=0;i--)if(enemies[i].x<20){finish();return}tower.forEach(t=>{t.cool-=dt;if(t.cool<=0&&enemies.length){let e=enemies.reduce((a,b)=>a.x<b.x?a:b);if(Math.hypot(e.x-t.x,e.y-t.y)<180){e.hp--;t.cool=.6;if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);setScore(score+1)}}}})}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(game==='clicker'){$('score').textContent=clicks;comboTimer=Math.max(0,comboTimer-dt);if(!comboTimer)combo=0}}
function draw(){ctx.fillStyle=game==='runner'?'#0c1826':game==='orbit'?'#10152c':game==='blocks'?'#201429':'#0b1020';ctx.fillRect(0,0,W,H);for(let i=0;i<50;i++){let x=(i*173.7+Math.sin(elapsed*.2+i)*13)%W,y=(i*91.3+elapsed*(8+i%4))%H;ctx.fillStyle='#d5e9ff44';ctx.fillRect(x,y,1.5,1.5)}if(game==='survival'||game==='orbit'){gems.forEach(g=>{ctx.fillStyle='#70f6e5';ctx.shadowBlur=14;ctx.shadowColor='#70f6e5';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill();ctx.shadowBlur=0});bullets.forEach(b=>{ctx.fillStyle='#d3ffff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()});enemies.forEach(e=>{ctx.fillStyle=game==='orbit'?'#fb687e':'#ff5389';ctx.shadowBlur=13;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.shadowBlur=0});ctx.globalAlpha=player.inv>0?.4:1;ctx.fillStyle='#8cffff';ctx.shadowBlur=22;ctx.shadowColor='#69f4ff';ctx.beginPath();ctx.arc(player.x,player.y,13,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;if(game==='survival'){ctx.fillStyle='#ffffffaa';ctx.fillRect(14,14,100,6);ctx.fillStyle='#ff6785';ctx.fillRect(14,14,100*player.hp/100,6)}}
 if(game==='runner'){let ground=H*.78;ctx.fillStyle='#68f3dc';ctx.fillRect(0,ground,W,2);ctx.fillStyle='#a98bff';ctx.fillRect(48,runnerY,24,24);obstacles.forEach(o=>{ctx.fillStyle='#ff5489';ctx.fillRect(o.x,o.y,o.w,o.h)});gems.forEach(g=>{ctx.fillStyle='#6bf4e0';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill()})}
 if(game==='blocks'){ctx.fillStyle='#b38dff';ctx.fillRect(player.x-14,12,28,12);orbital.forEach(o=>{ctx.fillStyle='#ff6388';ctx.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2)})}
 if(game==='defense'){ctx.fillStyle='#f06b91';enemies.forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()});ctx.fillStyle='#68e7bb';tower.forEach(t=>{ctx.beginPath();ctx.arc(t.x,t.y,11,0,7);ctx.fill()});ctx.fillStyle='#ffffff55';ctx.fillRect(0,0,8,H)}
 if(game==='clicker'){let pulse=1+Math.sin(elapsed*4)*.06;ctx.save();ctx.translate(W/2,H/2);ctx.scale(pulse,pulse);ctx.shadowBlur=35;ctx.shadowColor='#67f0de';ctx.fillStyle='#4fe3c7';ctx.beginPath();ctx.arc(0,0,72,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#10231f';ctx.font='52px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',0,2);ctx.restore();ctx.fillStyle='#eee';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText(combo?`連擊 x${combo}`:'點擊核心收集量子能量',W/2,H/2+115)}
 if(game==='color'){let n=Math.min(8,3+tileRound),size=Math.min(W*.78,H*.68)/n,ox=(W-size*n)/2,oy=(H-size*n)/2;let target=Math.floor(Math.random()*n*n),hue=(tileRound*43+160)%360;for(let i=0;i<n*n;i++){let x=ox+(i%n)*size,y=oy+Math.floor(i/n)*size;ctx.fillStyle=`hsl(${hue},70%,${i===target?68:48}%)`;ctx.beginPath();ctx.roundRect(x+3,y+3,size-6,size-6,7);ctx.fill()}ctx.fillStyle='white';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('找出顏色較亮的方格',W/2,oy-18);canvas.dataset.target=target;canvas.dataset.n=n;canvas.dataset.size=size;canvas.dataset.ox=ox;canvas.dataset.oy=oy}
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1}
function loop(now){if(state!=='play')return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(state==='play')raf=requestAnimationFrame(loop)}function finish(){state='finish';cancelAnimationFrame(raf);$('pause').classList.add('hide');$('endTitle').textContent=game==='runner'?'衝刺結束！':'遊戲結束';$('endEmoji').textContent=game==='runner'?'🏁':'✨';$('endText').textContent=`本次得分 ${Math.floor(score)} · 等級 ${level}`;$('finish').classList.remove('hidden');draw()}
function jump(){if(game==='runner'&&state==='play'&&runnerY>=H*.78-25)runnerV=-350}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();jump()}if(e.key==='Escape'&&state==='play')pauseGame()});window.addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('pointerdown',e=>{if(state==='clicker'){combo=comboTimer>0?combo+1:1;comboTimer=.7;clicks+=combo;setScore(clicks);draw()}else if(game==='runner')jump();else if(game==='defense'&&state==='play'){let r=canvas.getBoundingClientRect();tower.push({x:e.clientX-r.left,y:e.clientY-r.top,cool:0})}else if(game==='color'&&state==='play'){let r=canvas.getBoundingClientRect(),n=+canvas.dataset.n,size=+canvas.dataset.size,ox=+canvas.dataset.ox,oy=+canvas.dataset.oy,col=Math.floor((e.clientX-r.left-ox)/size),row=Math.floor((e.clientY-r.top-oy)/size),pick=row*n+col;if(pick===+canvas.dataset.target){tileRound++;setScore(score+10);draw()}else finish()}});
function pauseGame(){if(state==='play'){state='paused';cancelAnimationFrame(raf);$('introTitle').textContent='遊戲暫停';$('introEmoji').textContent='Ⅱ';$('introText').textContent='休息一下，準備好後繼續。';$('start').textContent='繼續遊戲　▶';$('intro').classList.remove('hidden');$('pause').textContent='▶ 繼續'}else if(state==='paused'){state='play';$('intro').classList.add('hidden');$('pause').textContent='Ⅱ 暫停';last=performance.now();raf=requestAnimationFrame(loop)}}$('pause').onclick=pauseGame;
// Memory match mode
function memoryStart(){baseReset();state='memory';$('intro').classList.add('hidden');$('memoryOverlay').classList.remove('hidden');$('pause').classList.add('hide');let icons=['🌙','🌟','🚀','💎','🪐','👾','🎮','🔮'];mem={cards:[...icons,...icons].sort(()=>Math.random()-.5),open:[],matched:[],moves:0,lock:false};$('memoryStatus').textContent='步數：0';let box=$('memoryGrid');box.innerHTML='';mem.cards.forEach((v,i)=>{let b=document.createElement('button');b.className='memory-card';b.textContent='?';b.onclick=()=>{if(mem.lock||mem.matched.includes(i)||mem.open.includes(i))return;b.textContent=v;b.classList.add('flipped');mem.open.push(i);if(mem.open.length===2){mem.moves++;$('memoryStatus').textContent=`步數：${mem.moves}`;if(mem.cards[mem.open[0]]===mem.cards[mem.open[1]]){mem.matched.push(...mem.open);mem.open=[];if(mem.matched.length===16){$('memoryStatus').textContent=`完成！共用了 ${mem.moves} 步 🎉`;setScore(Math.max(0,1000-mem.moves*10))}}else{mem.lock=true;setTimeout(()=>{mem.open.forEach(j=>{box.children[j].textContent='?';box.children[j].classList.remove('flipped')});mem.open=[];mem.lock=false},700)}}};box.append(b)})}
$('memoryRestart').onclick=memoryStart;$('start').onclick=()=>{if(state==='paused')pauseGame();else if(game==='color'){begin();state='play';tileRound=0;draw()}else begin()};$('replay').onclick=()=>{if(game==='memory')memoryStart();else begin()};$('pause').classList.toggle('hide',game==='memory'||game==='clicker');if(game==='color'){$('hint').textContent='點擊顏色較亮的方格，答錯就結束！'}else if(game==='runner'){$('hint').textContent='空白鍵／點擊跳躍　·　避開障礙並收集能量'}else if(game==='defense'){$('hint').textContent='點擊場地放置防禦塔　·　保護左側基地'}else if(game==='clicker'){$('hint').textContent='快速點擊能量核心，累積連擊！'}else if(game==='blocks'){$('hint').textContent='左右方向鍵移動　·　躲避落下的方塊'};if(game==='color')$('introText').textContent=config[game][2];if(game==='defense')$('introText').textContent=config[game][2];if(game==='blocks')$('introText').textContent=config[game][2];if(game==='clicker')$('introText').textContent=config[game][2];$('introTitle').textContent=config[game][0];$('introEmoji').textContent=config[game][1];$('intro').classList.remove('hidden');draw();})();
</script></body></html>
