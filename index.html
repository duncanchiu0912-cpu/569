<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>PLAYBOX｜遊戲基地</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1b20;--muted:#a1a1ad;--pink:#ff4d83;--line:#ffffff16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f7f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#15161a;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:3}.brand{font-size:21px;font-weight:900;padding:0 10px 28px}.brand i{font-style:normal;color:var(--pink)}.nav{display:grid;gap:5px}.nav button,.shop-open{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#c5c5ce;font-weight:700}.nav button:hover,.nav .active,.shop-open:hover{background:#ffffff10;color:white}.nav .active{box-shadow:inset 3px 0 var(--pink)}.shop-open{margin-top:20px;background:#ff4d8318;border:1px solid #ff4d8348;color:#ff9ab6}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;padding:10px}.main{margin-left:220px;padding:26px clamp(18px,4vw,54px);max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.top h1{font-size:30px;margin:0 0 4px;letter-spacing:-.7px}.top p{margin:0;color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:9px}.coins{background:#26221a;border:1px solid #d5aa4a38;padding:10px 13px;border-radius:11px;color:#ffd46c;font-size:13px;font-weight:850;white-space:nowrap}.search{width:min(270px,30vw);background:#1b1c21;border:1px solid var(--line);padding:10px 12px;border-radius:11px;outline:none}.search:focus{border-color:#ff4d8377}.hero{position:relative;min-height:250px;padding:34px;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 78% 45%,#ffb1b42b,transparent 28%),linear-gradient(110deg,#292151,#77345c 75%,#9a455f)}.hero:after{content:'🤖';position:absolute;right:9%;top:50%;transform:translateY(-50%) rotate(-7deg);font-size:130px;filter:drop-shadow(0 20px 20px #0005)}.hero-content{max-width:490px;position:relative;z-index:1}.pill{font-size:10px;letter-spacing:.13em;background:#ffffff20;border:1px solid #ffffff2a;border-radius:99px;padding:6px 9px;font-weight:800}.hero h2{font-size:clamp(30px,5vw,47px);line-height:1.04;margin:17px 0 9px}.hero p{font-size:13px;color:#f0ddeb;line-height:1.55}.primary{border:0;background:#fff;color:#211922;border-radius:10px;padding:11px 16px;font-weight:850}.primary:hover{transform:translateY(-1px)}.section{margin-top:29px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.sectionhead h2{margin:0;font-size:18px}.sectionhead p{margin:5px 0 0;color:var(--muted);font-size:11px}.filters{display:flex;gap:7px;overflow:auto;margin:13px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#1c1d22;border-radius:99px;padding:7px 12px;color:#bbb;font-size:11px}.chip.active{color:#ff95b1;border-color:#ff4d8370;background:#ff4d8318}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.game{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s}.game:hover{transform:translateY(-4px);border-color:#ffffff38}.cover{height:128px;background:var(--bgc);display:grid;place-items:center;position:relative;overflow:hidden}.cover:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#ffffff16;right:-40px;top:-75px}.emoji{font-size:61px;filter:drop-shadow(0 9px 10px #0005);z-index:1}.badge{position:absolute;top:9px;left:9px;font-size:9px;background:#13141acc;padding:5px 7px;border-radius:6px}.fav{position:absolute;right:8px;top:7px;background:#15151bba;border:1px solid #ffffff32;border-radius:8px;width:28px;height:28px;color:white}.fav.on{color:#ff638c}.info{padding:11px}.info b{font-size:12px}.meta{display:flex;justify-content:space-between;color:#9999a4;font-size:10px;margin-top:8px}.tag{color:#c4b1ff}.empty{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed #ffffff20;border-radius:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:10;backdrop-filter:blur(7px)}.modal.open{display:grid}.shop{width:min(730px,100%);max-height:90vh;overflow:auto;background:#18191e;border:1px solid #ffffff24;border-radius:20px;padding:22px}.shophead{display:flex;justify-content:space-between;align-items:center}.shophead h2{margin:0}.close{border:1px solid var(--line);background:#ffffff0b;border-radius:9px;padding:7px 10px}.shopintro{color:var(--muted);font-size:12px;line-height:1.5}.shopbalance{color:#ffd46c;font-weight:850}.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.item{background:#22232a;border:1px solid #ffffff16;border-radius:13px;padding:14px;display:grid;grid-template-columns:39px 1fr auto;gap:9px;align-items:center}.item .itemico{font-size:25px}.item b{font-size:12px}.item small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:4px}.buy{border:0;border-radius:8px;background:linear-gradient(110deg,#ff638c,#bc8cff);color:#211422;padding:8px 10px;font-size:10px;font-weight:900;white-space:nowrap}.buy:disabled{opacity:.45;cursor:not-allowed}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#292a30;border:1px solid #ffffff25;border-radius:10px;padding:10px 14px;font-size:12px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:740px){.side{width:63px;padding:18px 7px}.brand{font-size:0;padding:0 10px 22px}.brand:first-letter{font-size:21px}.nav button,.shop-open{font-size:0;text-align:center;padding:12px 3px}.nav button:before{font-size:18px}.nav button[data-view=all]:before{content:'⌂'}.nav button[data-view=popular]:before{content:'🔥'}.nav button[data-view=new]:before{content:'✦'}.nav button[data-view=favorites]:before{content:'♡'}.shop-open:before{content:'🛒';font-size:17px}.sidefoot{display:none}.main{margin-left:63px;padding:18px 13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cover{height:112px}.emoji{font-size:53px}.hero{min-height:225px;padding:24px}.hero:after{right:-13px;font-size:100px;opacity:.7}.hero-content{max-width:75%}.hero h2{font-size:32px}.hero p{font-size:11px}.top{align-items:flex-start}.top h1{font-size:22px}.top p{font-size:10px}.topright{flex-direction:column-reverse;align-items:flex-end}.search{width:min(200px,43vw);font-size:11px}.coins{font-size:11px;padding:8px}.shopgrid{grid-template-columns:1fr}.sectionhead h2{font-size:16px}}
</style></head><body>
<aside class="side"><div class="brand">PLAY<i>BOX</i></div><nav class="nav"><button class="active" data-view="all">⌂　探索遊戲</button><button data-view="popular">🔥　人氣排行</button><button data-view="new">✦　最新上架</button><button data-view="favorites">♡　我的收藏</button></nav><button class="shop-open" id="openShop">🛒　升級商店</button><div class="sidefoot">PLAYBOX · 免費遊戲基地</div></aside>
<main class="main"><header class="top"><div><h1>遊戲基地 🎮</h1><p>選一款喜歡的遊戲，開始玩並賺取遊戲幣。</p></div><div class="topright"><input class="search" id="search" placeholder="搜尋遊戲…"><div class="coins">🪙 <span id="coinCount">0</span></div></div></header>
<section class="hero"><div class="hero-content"><span class="pill">✦ 本週精選 · 可立即遊玩</span><h2>AI 核心：<br>生存協議</h2><p>升級你的 AI 核心，在霓虹攻勢中存活。收集資料、解鎖能力，挑戰最高紀錄。</p><button class="primary" data-play="survival">▶　立即遊玩</button></div></section>
<section class="section"><div class="sectionhead"><div><h2 id="heading">探索遊戲</h2><p>玩遊戲賺遊戲幣，前往商店解鎖永久強化。</p></div><button class="chip" id="shopFromTop">🛒 升級商店</button></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section></main>
<div class="modal" id="shopModal"><section class="shop"><div class="shophead"><h2>🛒 升級商店</h2><button class="close" id="closeShop">✕</button></div><p class="shopintro">使用遊戲中賺取的遊戲幣購買永久升級。每項升級可重複購買，效果會套用到 AI 核心生存遊戲。</p><p class="shopbalance">目前餘額：🪙 <span id="shopCoins">0</span></p><div class="shopgrid" id="shopGrid"></div></section></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const games=[['survival','AI 核心：生存協議','🤖','動作','4.9','精選','linear-gradient(135deg,#29205e,#b24273)'],['runner','霓虹資料衝刺','🏃','跑酷','4.8','熱門','linear-gradient(135deg,#103e68,#20a8a0)'],['memory','記憶矩陣','🧠','益智','4.7','動動腦','linear-gradient(135deg,#5a277b,#d64d92)'],['orbit','星環守衛','🪐','動作','4.6','最新','linear-gradient(135deg,#173e62,#7161d7)'],['blocks','方塊工坊','🧩','益智','4.8','人氣','linear-gradient(135deg,#7c3d20,#db9a3e)'],['clicker','量子點擊工廠','⚡','休閒','4.5','放鬆','linear-gradient(135deg,#164c49,#48bd8a)'],['defense','像素塔防：基地線','🏰','策略','4.6','策略','linear-gradient(135deg,#472844,#d55663)'],['color','色彩反應測驗','🎨','益智','4.4','最新','linear-gradient(135deg,#28529a,#b84eb6)']].map(([id,title,emoji,cat,rating,badge,bg])=>({id,title,emoji,cat,rating,badge,bg}));const items=[{id:'damage',icon:'💥',title:'量子增幅',desc:'生存模式武器傷害 +1',base:80},{id:'health',icon:'💚',title:'核心擴容',desc:'生存模式最大生命 +20',base:70},{id:'speed',icon:'💨',title:'敏捷協定',desc:'生存模式移動速度 +10%',base:65},{id:'magnet',icon:'🧲',title:'資料磁吸',desc:'生存模式碎片吸取範圍 +25%',base:60},{id:'bonus',icon:'🪙',title:'獎勵加成',desc:'每局結算遊戲幣 +10%',base:100}];let coins=+(localStorage.getItem('pb-coins')||0),owned=JSON.parse(localStorage.getItem('pb-upgrades')||'{}'),favs=JSON.parse(localStorage.getItem('pb-favs')||'[]'),cat='全部',view='all';const $=id=>document.getElementById(id);function sync(){localStorage.setItem('pb-coins',coins);localStorage.setItem('pb-upgrades',JSON.stringify(owned));$('coinCount').textContent=coins;$('shopCoins').textContent=coins;renderShop()};function itemCost(it){return it.base*Math.pow(2,owned[it.id]||0)}function renderShop(){$('shopGrid').innerHTML=items.map(it=>{let cost=itemCost(it);return `<article class="item"><span class="itemico">${it.icon}</span><div><b>${it.title} · Lv.${owned[it.id]||0}</b><small>${it.desc}。下一級價格 ${cost} 幣。</small></div><button class="buy" data-buy="${it.id}" ${coins<cost?'disabled':''}>🪙 ${cost}　升級</button></article>`}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))}function buy(id){let it=items.find(x=>x.id===id),cost=itemCost(it);if(coins<cost)return toast('遊戲幣不足，先去玩幾局吧！');coins-=cost;owned[id]=(owned[id]||0)+1;sync();toast(`已購買「${it.title}」Lv.${owned[id]}！`)}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}function render(){let q=$('search').value.toLowerCase(),list=games.filter(g=>(!q||(g.title+g.cat).toLowerCase().includes(q))&&(cat==='全部'||g.cat===cat)&&(view!=='favorites'||favs.includes(g.id)));if(view==='popular')list.sort((a,b)=>+b.rating- +a.rating);if(view==='new')list=list.filter(g=>g.badge==='最新');$('heading').textContent={all:'探索遊戲',popular:'人氣排行',new:'最新上架',favorites:'我的收藏'}[view];$('grid').innerHTML=list.length?list.map(g=>`<article class="game" data-play="${g.id}"><div class="cover" style="--bgc:${g.bg}"><span class="badge">${g.badge}</span><button class="fav ${favs.includes(g.id)?'on':''}" data-fav="${g.id}">${favs.includes(g.id)?'♥':'♡'}</button><span class="emoji">${g.emoji}</span></div><div class="info"><b>${g.title}</b><div class="meta"><span class="tag">${g.cat}</span><span>★ ${g.rating}</span></div></div></article>`).join(''):'<div class="empty">沒有找到遊戲，試試其他分類或搜尋。</div>';document.querySelectorAll('[data-play]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-fav]'))return;location.href=`play.html?game=${e.dataset.play}`});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('pb-favs',JSON.stringify(favs));render()})}const cats=['全部','動作','跑酷','益智','休閒','策略'];$('filters').innerHTML=cats.map(x=>`<button class="chip ${x==='全部'?'active':''}" data-cat="${x}">${x}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;cat='全部';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat==='全部'));render()});$('search').oninput=render;function toggle(open){$('shopModal').classList.toggle('open',open);if(open)renderShop()}$('openShop').onclick=$('shopFromTop').onclick=()=>toggle(true);$('closeShop').onclick=()=>toggle(false);$('shopModal').onclick=e=>{if(e.target===$('shopModal'))toggle(false)};sync();render()})();
</script></body></html>
