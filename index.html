<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>PLAYBOX｜你的遊戲基地</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191a1f;--panel2:#202127;--line:#ffffff12;--text:#f6f6f7;--muted:#9b9ba5;--pink:#ff4d83;--purple:#a98bff;--green:#73e0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}.layout{min-height:100vh}.sidebar{width:232px;position:fixed;inset:0 auto 0 0;background:#141519;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:2px 9px 26px;font-weight:900;font-size:20px;letter-spacing:-.7px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4d83,#ab82ff);border-radius:11px;font-size:19px;color:#fff;box-shadow:0 6px 24px #ff4d8330}.brand em{font-style:normal;color:var(--pink)}.nav-label{padding:9px 11px;color:#777984;font-size:10px;font-weight:800;letter-spacing:.15em}.nav{display:grid;gap:4px}.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#b9bac3;font-weight:650;font-size:13px;display:flex;align-items:center;gap:12px;transition:.15s}.nav-btn:hover,.nav-btn.active{background:#ffffff0d;color:#fff}.nav-btn.active{box-shadow:inset 3px 0 var(--pink)}.nav-btn .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.profile{display:flex;align-items:center;gap:10px;background:#ffffff08;border:1px solid var(--line);padding:10px;border-radius:13px}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#5839aa,#ff4d83);font-weight:900}.profile b{font-size:12px}.profile small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.main{margin-left:232px;min-height:100vh;padding:24px clamp(18px,4vw,54px) 50px;max-width:1650px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.welcome h1{font-size:clamp(23px,3vw,34px);letter-spacing:-1px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:10px;align-items:center}.search{position:relative;width:min(330px,36vw)}.search input{width:100%;background:#1b1c21;border:1px solid var(--line);border-radius:12px;padding:11px 13px 11px 39px;color:white;outline:none}.search input:focus{border-color:#ff4d8388}.search span{position:absolute;left:13px;top:10px;color:#9697a0}.icon-btn{width:41px;height:41px;border-radius:12px;background:#1b1c21;border:1px solid var(--line);font-size:17px}.hero{position:relative;min-height:282px;border-radius:22px;overflow:hidden;padding:clamp(24px,4vw,45px);display:flex;align-items:center;background:linear-gradient(105deg,#28204f 0%,#39204d 44%,#a34362 100%);box-shadow:0 18px 55px #0003}.hero:after{content:"✦";position:absolute;right:9%;top:-90px;font-size:360px;line-height:1;color:#ffffff0c;transform:rotate(12deg)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 74% 40%,#ffb2b73a,transparent 34%),radial-gradient(ellipse at 94% 95%,#a98bff3a,transparent 36%)}.hero-content{max-width:490px;position:relative;z-index:1}.pill{display:inline-flex;align-items:center;gap:7px;background:#ffffff20;border:1px solid #ffffff24;border-radius:99px;padding:6px 10px;font-size:10px;letter-spacing:.1em;font-weight:800}.hero h2{font-size:clamp(30px,5vw,51px);line-height:1.04;letter-spacing:-1.6px;margin:17px 0 10px}.hero p{font-size:13px;color:#f1ddec;line-height:1.6;margin:0 0 19px;max-width:400px}.play-btn{border:0;border-radius:11px;padding:11px 17px;background:#fff;color:#24202c;font-size:12px;font-weight:850;box-shadow:0 8px 22px #0002}.play-btn:hover{transform:translateY(-2px);background:#fff3f7}.hero-art{position:absolute;right:9%;top:50%;transform:translateY(-50%) rotate(-7deg);width:190px;height:205px;border:1px solid #ffffff4a;border-radius:30px;background:linear-gradient(145deg,#ffffff22,#ffffff08);box-shadow:0 25px 55px #1a0b3370;display:grid;place-items:center;font-size:102px;z-index:1;backdrop-filter:blur(8px)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:30px 0 14px;gap:12px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.3px}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.text-btn{border:0;background:none;color:#f2a4c0;font-size:11px;font-weight:750}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin:15px 0 17px;scrollbar-width:none}.chip{white-space:nowrap;background:#1c1d22;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#bbbcc5;font-size:11px;font-weight:700}.chip.active{background:#ff4d831c;border-color:#ff4d8370;color:#ff8baa}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.game-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:transform .18s,border-color .18s;cursor:pointer}.game-card:hover{transform:translateY(-4px);border-color:#ffffff30}.cover{height:143px;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--cover);isolation:isolate}.cover:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:#ffffff13;right:-30px;top:-75px}.cover:after{content:"";position:absolute;width:100px;height:100px;border-radius:22px;border:1px solid #ffffff26;transform:rotate(35deg);left:20px;bottom:-57px}.cover-emoji{font-size:65px;filter:drop-shadow(0 10px 12px #0005);transform:rotate(-7deg);transition:transform .2s}.game-card:hover .cover-emoji{transform:rotate(0) scale(1.1)}.badge{position:absolute;top:10px;left:10px;background:#13141acc;border:1px solid #ffffff24;border-radius:6px;padding:5px 7px;font-size:9px;font-weight:850;letter-spacing:.05em}.fav{position:absolute;right:9px;top:8px;width:29px;height:29px;border:1px solid #ffffff35;background:#15151b99;border-radius:9px;font-size:15px}.fav.on{color:#ff638c}.card-info{padding:12px 12px 13px}.card-title{display:flex;align-items:center;justify-content:space-between;gap:6px}.card-title h3{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rating{font-size:10px;color:#ffd17b;white-space:nowrap}.card-meta{display:flex;justify-content:space-between;align-items:center;color:#8f909a;font-size:10px;margin-top:8px}.tag{color:#c6b7ff}.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted);border:1px dashed #ffffff22;border-radius:15px}.recent-row{display:flex;gap:11px;overflow:auto;padding:2px 0 8px}.recent-item{min-width:205px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px;cursor:pointer}.recent-icon{width:48px;height:45px;border-radius:9px;background:var(--cover);display:grid;place-items:center;font-size:23px}.recent-item b{font-size:11px}.recent-item small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#28292f;border:1px solid #ffffff24;border-radius:11px;padding:11px 16px;font-size:12px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-art{right:5%;width:155px;height:170px;font-size:80px}}
@media(max-width:760px){.sidebar{width:68px;padding:17px 8px}.brand{padding:0 9px 24px}.brand-name,.nav-label,.nav-btn .label,.profile>div:not(.avatar){display:none}.nav-btn{justify-content:center;padding:12px 7px}.nav-btn .ico{font-size:18px}.profile{justify-content:center;padding:7px}.main{margin-left:68px;padding:19px 17px 85px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:125px}.top{align-items:flex-start}.top-actions{flex-direction:column-reverse;align-items:flex-end}.search{width:min(230px,42vw)}.hero-art{opacity:.55;right:-12px}.hero-content{max-width:65%}.hero h2{font-size:32px}.hero p{font-size:12px}.mobile-nav{display:flex;position:fixed;z-index:6;bottom:0;left:68px;right:0;background:#15161bee;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mobile-nav button{background:none;border:0;color:#aaa;font-size:9px;display:grid;gap:3px;justify-items:center}.mobile-nav button b{font-size:17px}}
@media(max-width:420px){.welcome p{font-size:11px}.welcome h1{font-size:23px}.search input{padding:10px 8px 10px 32px;font-size:11px}.search span{left:10px}.icon-btn{width:37px;height:37px}.hero{min-height:242px}.hero-art{width:112px;height:130px;font-size:63px}.hero-content{max-width:74%}.hero h2{font-size:28px}.hero .pill{font-size:8px}.cover{height:108px}.cover-emoji{font-size:53px}.card-info{padding:10px}.card-title h3{font-size:12px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="brand"><div class="brand-mark">P</div><span class="brand-name">PLAY<em>BOX</em></span></div><div class="nav-label">遊戲基地</div><nav class="nav"><button class="nav-btn active" data-view="all"><span class="ico">⌂</span><span class="label">探索遊戲</span></button><button class="nav-btn" data-view="popular"><span class="ico">🔥</span><span class="label">人氣排行</span></button><button class="nav-btn" data-view="new"><span class="ico">✦</span><span class="label">最新上架</span></button><button class="nav-btn" data-view="favorites"><span class="ico">♡</span><span class="label">我的收藏</span></button></nav><div class="side-bottom"><div class="nav-label">你的玩家檔案</div><div class="profile"><div class="avatar">P</div><div><b>玩家</b><small>探索者等級 1</small></div></div></div></aside>
<main class="main"><header class="top"><div class="welcome"><h1>遊戲基地 🎮</h1><p>今天想玩點什麼？挑一款，馬上開始。</p></div><div class="top-actions"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋遊戲…" autocomplete="off"></label><button class="icon-btn" id="shuffle" title="隨機遊戲">⤨</button></div></header>
<section class="hero"><div class="hero-content"><span class="pill">✦ 本週精選 · 可立即遊玩</span><h2>AI 核心：<br>生存協議</h2><p>升級你的 AI 核心，在霓虹攻勢中存活下來。收集資料、解鎖能力，挑戰你的最高紀錄。</p><button class="play-btn" data-launch="survival">▶　立即遊玩</button></div><div class="hero-art" aria-hidden="true">🤖</div></section>
<section><div class="section-head"><div><h2 id="sectionTitle">探索遊戲</h2><p id="sectionSub">精選好玩的免費小遊戲，點開即玩。</p></div><button class="text-btn" id="resetFilters">清除篩選　↗</button></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
<section id="recentSection" style="display:none"><div class="section-head"><div><h2>最近玩過</h2><p>接著上次的樂趣繼續玩</p></div></div><div class="recent-row" id="recent"></div></section>
</main><nav class="mobile-nav"><button data-view="all"><b>⌂</b>探索</button><button data-view="popular"><b>🔥</b>人氣</button><button data-view="new"><b>✦</b>最新</button><button data-view="favorites"><b>♡</b>收藏</button></nav><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const games=[
{id:'survival',title:'AI 核心：生存協議',emoji:'🤖',category:'動作',rating:'4.9',players:'2.4k',badge:'本週精選',cover:'linear-gradient(135deg,#29205e,#b24273)',desc:'升級 AI 核心，在敵方攻勢中生存。'},
{id:'runner',title:'霓虹資料衝刺',emoji:'🏃',category:'跑酷',rating:'4.8',players:'1.8k',badge:'熱門',cover:'linear-gradient(135deg,#103e68,#20a8a0)',desc:'穿越霓虹資料流，收集能量並躲避障礙。'},
{id:'memory',title:'記憶矩陣',emoji:'🧠',category:'益智',rating:'4.7',players:'960',badge:'動動腦',cover:'linear-gradient(135deg,#5a277b,#d64d92)',desc:'翻開卡牌，測試你的記憶力。'},
{id:'orbit',title:'星環守衛',emoji:'🪐',category:'動作',rating:'4.6',players:'740',badge:'新上架',cover:'linear-gradient(135deg,#173e62,#7161d7)',desc:'守護星環，反應夠快就能撐得更久。'},
{id:'blocks',title:'方塊工坊',emoji:'🧩',category:'益智',rating:'4.8',players:'1.2k',badge:'人氣',cover:'linear-gradient(135deg,#7c3d20,#db9a3e)',desc:'旋轉與排列方塊，消除整行取得高分。'},
{id:'clicker',title:'量子點擊工廠',emoji:'⚡',category:'休閒',rating:'4.5',players:'830',badge:'放鬆玩',cover:'linear-gradient(135deg,#164c49,#48bd8a)',desc:'點擊收集能量，升級你的量子工廠。'},
{id:'defense',title:'像素塔防：基地線',emoji:'🏰',category:'策略',rating:'4.6',players:'560',badge:'策略',cover:'linear-gradient(135deg,#472844,#d55663)',desc:'部署防禦塔，阻止像素敵人抵達基地。'},
{id:'color',title:'色彩反應測驗',emoji:'🎨',category:'益智',rating:'4.4',players:'410',badge:'新上架',cover:'linear-gradient(135deg,#28529a,#b84eb6)',desc:'快速辨認色彩，在倒數結束前完成挑戰。'}];
let category='全部',view='all',favorites=JSON.parse(localStorage.getItem('pb-favs')||'[]'),recent=JSON.parse(localStorage.getItem('pb-recent')||'[]');const $=id=>document.getElementById(id);const categories=['全部','動作','跑酷','益智','休閒','策略'];
function drawChips(){ $('chips').innerHTML=categories.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{category=b.dataset.cat;drawChips();render()})}
function visibleGames(){let list=[...games];const q=$('search').value.trim().toLowerCase();if(q)list=list.filter(g=>(g.title+g.category+g.desc).toLowerCase().includes(q));if(category!=='全部')list=list.filter(g=>g.category===category);if(view==='favorites')list=list.filter(g=>favorites.includes(g.id));if(view==='popular')list.sort((a,b)=>parseFloat(b.rating)-parseFloat(a.rating));if(view==='new')list=list.filter(g=>g.badge==='新上架');return list}
function render(){const list=visibleGames();$('grid').innerHTML=list.length?list.map(g=>`<article class="game-card" data-launch="${g.id}" tabindex="0"><div class="cover" style="--cover:${g.cover}"><span class="badge">${g.badge}</span><button class="fav ${favorites.includes(g.id)?'on':''}" data-fav="${g.id}" aria-label="收藏">${favorites.includes(g.id)?'♥':'♡'}</button><span class="cover-emoji">${g.emoji}</span></div><div class="card-info"><div class="card-title"><h3>${g.title}</h3><span class="rating">★ ${g.rating}</span></div><div class="card-meta"><span class="tag">${g.category}</span><span>◉ ${g.players} 人玩</span></div></div></article>`).join(''):'<div class="empty">這裡暫時沒有遊戲，試試其他分類或搜尋吧。</div>';document.querySelectorAll('[data-launch]').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-fav]'))return;launch(el.dataset.launch)};el.onkeydown=e=>{if(e.key==='Enter')launch(el.dataset.launch)}});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('pb-favs',JSON.stringify(favorites));render()});$('sectionTitle').textContent={all:'探索遊戲',popular:'人氣排行',new:'最新上架',favorites:'我的收藏'}[view];$('sectionSub').textContent={all:'精選好玩的免費小遊戲，點開即玩。',popular:'玩家們最常打開的遊戲。',new:'剛加入遊戲基地的新鮮作品。',favorites:'你收藏的遊戲都在這裡。'}[view];updateRecent()}
function updateRecent(){let items=recent.map(id=>games.find(g=>g.id===id)).filter(Boolean);$('recentSection').style.display=items.length?'':'none';$('recent').innerHTML=items.map(g=>`<div class="recent-item" data-launch="${g.id}"><div class="recent-icon" style="--cover:${g.cover}">${g.emoji}</div><div><b>${g.title}</b><small>點擊繼續遊玩　→</small></div></div>`).join('');document.querySelectorAll('#recent [data-launch]').forEach(el=>el.onclick=()=>launch(el.dataset.launch))}
function launch(id){recent=[id,...recent.filter(x=>x!==id)].slice(0,5);localStorage.setItem('pb-recent',JSON.stringify(recent));location.href=`play.html?game=${encodeURIComponent(id)}`}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));category='全部';drawChips();render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav-btn,[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('search').addEventListener('input',render);$('resetFilters').onclick=()=>{$('search').value='';category='全部';view='all';setView('all')};$('shuffle').onclick=()=>launch(games[Math.floor(Math.random()*games.length)].id);document.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>launch(b.dataset.launch));drawChips();render();})();
</script>
</body></html>
